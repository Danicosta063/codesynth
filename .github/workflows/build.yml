
name: Compilar Noob Pro Hacker God

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Mostrar versao do Gradle
        run: gradle --version

      - name: Compilar mod
        run: gradle build --stacktrace --no-daemon

      - name: Salvar JAR compilado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NoobProHackerGod
          path: build/libs/*.jar
          if-no-files-found: error
          
