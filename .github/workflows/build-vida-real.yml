name: Build Vida Real

on:
  push:
    branches: [main]
    paths:
      - 'vida-real/**'
      - '.github/workflows/build-vida-real.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vida-real

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Compilar Vida Real
        run: gradle build --no-daemon --stacktrace

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: VidaReal-0.0.3
          path: vida-real/build/libs/*.jar
          if-no-files-found: error
